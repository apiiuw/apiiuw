<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" width="100%" height="6">
  <defs>
    <linearGradient id="cyberLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .laser-pulse {
        animation: laserScan 3s infinite linear;
      }
      @keyframes laserScan {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(1000px); }
      }
    </style>
  </defs>
  <!-- Base track -->
  <line x1="0" y1="3" x2="1000" y2="3" stroke="#1E293B" stroke-width="1.5" />
  <!-- Traveling Laser beam -->
  <g class="laser-pulse" filter="url(#neonBlur)">
    <rect x="0" y="1" width="400" height="4" rx="2" fill="url(#cyberLaser)" />
  </g>
</svg>
